function Countdown({target}) {
  const [t,setT]=useState({d:0,h:0,m:0,s:0});

    const tick=()=>{const diff=new Date(target)-new Date();if(diff<=0){setT({d:0,h:0,m:0,s:0});return;}setT({d:Math.floor(diff/86400000),h:Math.floor((diff%86400000)/3600000),m:Math.floor((diff%3600000)/60000),s:Math.floor((diff%60000)/1000)});};

  },[target]);
  return (
    <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:20}}>
      <FlipDigit value={t.d} label="Hari"/><FlipDigit value={t.h} label="Jam"/>

// Reveal on scroll hook
function useReveal() {
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    const obs = new IntersectionObserver(([e])=>{
      if(e.isIntersecting){
        el.classList.remove("out");
        el.classList.add("in");
      } else if(el.classList.contains("in")){
        el.classList.remove("in");
        el.classList.add("out");
      }
    },{threshold:0.15});
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);
  return ref;
}

// Reveal wrapper component — Fix 1+2+5
function Reveal({children, delay=0, arabic=false, type="body"}) {
  const ref = useRef(null);
  const hasEntered = useRef(false);
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    const obs = new IntersectionObserver(([e])=>{
      if(e.isIntersecting){
        hasEntered.current = true;
        el.classList.remove("out");
        el.classList.add("in");
      } else if(hasEntered.current){
        el.classList.remove("in");
        el.classList.add("out");
        hasEntered.current = false;
      }
    },{threshold:0.08});
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);

  // Fix 5: map type → organic delay class
  const typeClass = {
    heading:"rv-heading", sub:"rv-sub", body:"rv-body",
    accent:"rv-accent", action:"rv-action", late:"rv-late"
  }[type] || "rv-body";

  if(arabic){
    // Fix 3: Arabic char-by-char from right
    return <ArabicReveal ref={ref} delay={delay}>{children}</ArabicReveal>;
  }
  return <div ref={ref} className={`rv ${typeClass}`}>{children}</div>;
}

// Fix 3: Arabic char-by-char from right with forwardRef
const ArabicReveal = React.forwardRef(function ArabicReveal({children, delay}, ref) {
  const innerRef = useRef(null);
  const [visible, setVisible] = useState(false);

  // Extract Arabic text from children (supports text nodes or <p> children)
  const extractText = (node) => {
    if(typeof node === "string") return node;
    if(node?.props?.children) return extractText(node.props.children);
    return "";
  };

  const text = extractText(children);
  // Split into chars, preserving spaces; reverse order for RTL reveal (rightmost first)
  const chars = text.split("").reverse();

  useEffect(()=>{
    const el = ref?.current || innerRef.current; if(!el) return;
    const obs = new IntersectionObserver(([e])=>{
      if(e.isIntersecting){ setVisible(true); }
      else { setVisible(false); }
    },{threshold:0.1});
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);

  // Clone the child element, replacing its text with animated spans
  const originalChild = React.Children.only(children);
  const style = originalChild.props.style || {};

  return (
    <div ref={ref || innerRef}>
      {React.cloneElement(originalChild, {
        children: chars.map((ch, i) => (
          <span
            key={i}
            className={visible ? "arabic-char visible" : "arabic-char"}
            style={{
              animationDelay: visible ? `${i * 0.045}s` : "0s",
            }}
          >
            {ch}
          </span>
        ))
      })}
    </div>
  );
});


function Section({id,children,onVisible}) {
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)onVisible(id);},{threshold:0.35});
    obs.observe(el);return()=>obs.disconnect();
  },[id,onVisible]);
  return (
    <section ref={ref} id={id} style={{position:"relative",minHeight:"100vh",width:"100%",display:"flex",alignItems:"center",justifyContent:"center",padding:"90px 32px 100px",boxSizing:"border-box"}}>

      <div style={{position:"relative",zIndex:5,width:"100%",maxWidth:310}}>{children}</div>
    </section>
  );
}

function MusicButton() {
  const [playing, setPlaying] = useState(false);

  useEffect(()=>{

    return ()=>clearTimeout(t);
  },[]);

  const toggle = () => {
    const audio = document.getElementById("bgMusic");
    if(!audio) return;
    if(playing){
      audio.pause();
      setPlaying(false);
    } else {
      audio.play().then(()=>setPlaying(true)).catch(()=>{});
    }
  };

  if(!visible) return null;

  return (
    <div
      onClick={toggle}
      className={`music-btn${playing?" playing":""}`}
      title={playing?"Pause musik":"Play musik"}
      style={{

            <span style={{...PP,fontSize:9,fontWeight:a?700:400,color:a?"#fff":"#9B7A3A"}}>{t.label}</span>
          </button>
        );})}
      </div>
    </div>
    <MusicButton/>
    </>
  );
}

window.addEventListener('load', function() {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App/>);
});
</script>
</body>
